# Netlify config for hosting pulsator.html game
[build]
  command = "echo 'No build step needed'"
  publish = "."

[[headers]]
  for = "/pulsator.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ad-api-pcoz.onrender.com; connect-src 'self' https://ad-api-pcoz.onrender.com wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self' https://*.netlify.app; frame-ancestors *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/"
  to = "/pulsator.html"
  status = 200