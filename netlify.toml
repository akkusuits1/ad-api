# Netlify config for hosting unity-rewarded.html static page
[build]
  command = "echo 'No build step needed'"
  publish = "src/main/resources/static"

[[headers]]
  for = "/unity-rewarded.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *; script-src 'self' 'unsafe-inline' https://webads.unityads.unity3d.com; connect-src 'self' https://*.unityads.unity3d.com https://*.unity3d.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"